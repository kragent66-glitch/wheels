name: Gap wheels

# For each release the build lab built cleanly where PyPI has no wheel, build it twice from its sdist, then call a
# wheel verified only if both builds are byte-identical, from the sdist PyPI publishes, and pip installs it without
# compiling anything. Each build runs in a workflow run of its own (gap-wheel-build.yml), so a package's build code
# can't write another build's result. The collect job writes manifest.json (filenames, hashes and each build's run) as
# an artifact and stages the verified wheels that may be published (each taken from its build run only with the
# verified sha256, and only if it needs no DLL, library or glibc symbol version a user's system may lack);
# install-test installs and imports them on fresh runners (Linux ones in a minimal container of their libc);
# publish attests the ones that passed, uploads them to the `gap-wheels` release, commits data/gap-wheels.json (the
# index the site builds) and starts a site deploy, but only after a maintainer approves the `publish` environment for
# that run. The candidate pairs come from the tracker's build
# lab (wheelgap/tracker data/builds.json). See scripts/gap_wheels.py and README.md (the threat model).

on:
  schedule:
    # Weekly, Monday morning, after the tracker's Sunday build lab and Monday scan.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      max:
        description: Most pairs this run (each is built twice)
        default: "200"
      only:
        description: Just these packages, comma-separated
        default: ""

permissions:
  contents: read

concurrency:
  group: gap-wheels
  cancel-in-progress: false

jobs:
  plan:
    # Only from main: the build runs are started from main, and collect checks they ran this commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35 # bounded worker pool and per-pair timeouts
    outputs:
      all: ${{ steps.plan.outputs.all }}
      since: ${{ steps.plan.outputs.since }}
      batch: ${{ steps.plan.outputs.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          # x86_64-unknown-linux-gnu uv 0.13.9 release archive SHA-256.
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
          enable-cache: false
      - id: plan
        env:
          # A weekly batch takes 60 pairs (120 builds, a few hours at 20 at a time), starting further on each week
          # (--rotate), so with more clean pairs than that none is left out week after week.
          MAX: ${{ inputs.max || '60' }}
          ONLY: ${{ inputs.only }}
          EVENT: ${{ github.event_name }}
        run: |
          # The build lab's results: which releases built cleanly where PyPI has no wheel. Read-only, from the tracker.
          curl -sfL --max-time 60 -o "$RUNNER_TEMP/builds.json" \
            https://raw.githubusercontent.com/wheelgap/tracker/main/data/builds.json
          rotate=; [ "$EVENT" = schedule ] && rotate=--rotate
          # The batch is fixed here, so re-running only a later job still finds this batch's build runs.
          echo "batch=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          python3 scripts/gap_wheels.py plan "$RUNNER_TEMP/builds.json" --max "$MAX" $rotate ${ONLY:+--only "$ONLY"} --lock-out "$RUNNER_TEMP/build-tool-locks.json" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Store the coordinator's immutable build-tool locks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-tool-locks
          path: ${{ runner.temp }}/build-tool-locks.json
          retention-days: 7

  dispatch:
    needs: plan
    if: needs.plan.outputs.all != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330 # it waits while 20 of the batch's builds are running
    permissions:
      actions: write # to start the build runs; this job runs only our own code
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the trusted coordinator locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-tool-locks
          path: ${{ runner.temp }}
      - name: Start one build run per build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAN: ${{ needs.plan.outputs.all }}
          BATCH: ${{ needs.plan.outputs.batch }}
          SINCE: ${{ needs.plan.outputs.since }}
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          python3 scripts/gap_wheels.py dispatch --plan "$RUNNER_TEMP/plan.json" --batch "$BATCH" --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" --since "$SINCE" --locks "$RUNNER_TEMP/build-tool-locks.json"

  collect:
    needs: [plan, dispatch]
    # Also when dispatch stopped partway: the builds it started still get collected.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.all != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: read
      contents: read
    outputs:
      staged_count: ${{ steps.stage.outputs.staged_count }}
      staged_sha256: ${{ steps.stage.outputs.staged_sha256 }}
      tests: ${{ steps.stage.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for the build runs and take each one's result
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.all }}
          SINCE: ${{ needs.plan.outputs.since }}
          BATCH: ${{ needs.plan.outputs.batch }}
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          python3 scripts/gap_wheels.py collect --plan "$RUNNER_TEMP/plan.json" --batch "$BATCH" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --since "$SINCE" --results results --wait 270
      - name: Restore the coordinator's build-tool locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-tool-locks
          path: ${{ runner.temp }}
      - name: Verify the pairs and write the manifest
        env:
          PLAN: ${{ needs.plan.outputs.all }}
        run: python3 scripts/gap_wheels.py merge results --plan "$RUNNER_TEMP/plan.json" --locks "$RUNNER_TEMP/build-tool-locks.json" --out manifest.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: manifest.json
          retention-days: 30
      - id: stage
        name: Stage the verified wheels that may be published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/gap_wheels.py stage --manifest manifest.json --staged staged --repo "$GITHUB_REPOSITORY" \
            --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged
          path: staged
          retention-days: 7

  install-test:
    # Installs and imports each staged wheel on a fresh runner of its target. This runs package code, so it gets a
    # read-only token and no secrets, and publish trusts its answers only to skip a wheel, never for which bytes.
    # Don't add actions/cache (or a setup action's cache) here: package code could write entries main restores.
    # Windows targets run on the runner with setup-python. Linux targets run in a minimal image of their libc with the
    # target's exact CPython (`image`, `interpreter`, and for 3.14t a pinned python-build-standalone: LINUX_TESTS in
    # scripts/gap_wheels.py), so the import proves the wheel works on a clean system, not on GitHub's well-stocked
    # runner image. With `docker run`, not a job container: setup-python and JavaScript actions don't run in Alpine.
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.tests != '' && needs.collect.outputs.tests != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.collect.outputs.tests) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.image == ''
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged
          path: staged
      - name: Install and import each wheel in a fresh venv
        if: matrix.image == ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/gap_wheels.py install-test --staged staged --target "$TARGET" --out tested.json
      - name: Fetch the target's pinned CPython, checked by sha256
        if: matrix.image != '' && matrix.python_url != ''
        shell: bash
        env:
          PYTHON_URL: ${{ matrix.python_url }}
          PYTHON_SHA256: ${{ matrix.python_sha256 }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL --max-time 300 -o "$RUNNER_TEMP/python.tar.gz" "$PYTHON_URL"
          echo "$PYTHON_SHA256  $RUNNER_TEMP/python.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/python"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP/python" --strip-components=1
      - name: Install and import each wheel in a fresh venv, in a minimal container
        if: matrix.image != ''
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          INTERPRETER: ${{ matrix.interpreter }}
          TARGET: ${{ matrix.target }}
        run: |
          # The checkout (with the staged wheels) and the CPython are mounted read-only; the answer goes to its own
          # folder, which root in the container can write to without capabilities. No token or secret is passed in,
          # and the container runs with no capabilities and can't gain privileges.
          mkdir -p "$RUNNER_TEMP/out"
          chmod 777 "$RUNNER_TEMP/out"
          python=()
          if [ -d "$RUNNER_TEMP/python" ]; then python=(-v "$RUNNER_TEMP/python:/opt/python:ro"); fi
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD:/lab:ro" -v "$RUNNER_TEMP/out:/out" "${python[@]}" -w /lab "$IMAGE" \
            "$INTERPRETER" scripts/gap_wheels.py install-test --staged staged --target "$TARGET" --out /out/tested.json
          # Package code ran as root in the container and could leave a symlink to a runner file here: take only a
          # regular file.
          answer="$RUNNER_TEMP/out/tested.json"
          if [ ! -f "$answer" ] || [ -L "$answer" ]; then echo "no tested.json from the container" >&2; exit 1; fi
          cp "$answer" tested.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-${{ matrix.slug }}
          path: tested.json
          retention-days: 7

  publish:
    # Never runs package code: it hashes files, attests them, uploads them and commits the index.
    needs: [collect, install-test]
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.staged_count != '' && needs.collect.outputs.staged_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A maintainer approves each publish: the environment's required reviewers (repo settings) gate this job.
    environment: publish
    concurrency:
      group: gap-wheels-publish
      cancel-in-progress: false
    permissions:
      contents: write # the gap-wheels release and data/gap-wheels.json
      actions: write # to start the site deploy
      id-token: write # attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged
          path: staged
      # Each install-test result goes into a folder of its artifact's name (tested-<slug>/tested.json), which is how
      # publish knows the target a result is for. download-artifact with a pattern puts a lone match straight into
      # `path`, with no folder, so a batch with one target published nothing: download them one by one instead.
      - name: Download the install-test results
        continue-on-error: true # no test results: nothing publishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tested
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name' \
            | grep -E '^tested-[A-Za-z0-9._-]+$' | sort -u | while read -r name; do
              gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "tested/$name" || true
            done
      - id: choose
        name: Choose the wheels to publish and update the index
        env:
          STAGED_SHA256: ${{ needs.collect.outputs.staged_sha256 }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/gap_wheels.py publish --staged-file staged/staged.json --staged-sha256 "$STAGED_SHA256" --files staged --tested tested \
            --index data/gap-wheels.json --release-dir release --run "$RUN" --summary "$GITHUB_STEP_SUMMARY"
          echo "count=$(find release -maxdepth 1 -name '*.whl' | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.choose.outputs.count != '0'
        with:
          subject-path: release/*.whl
      - name: Upload the wheels, commit the index, withdraw opted-out wheels, deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(find release -maxdepth 1 -name '*.whl' | wc -l)" != 0 ]; then
            gh release view gap-wheels >/dev/null 2>&1 || gh release create gap-wheels --prerelease --title "Gap wheels" \
              --notes "Wheels PyPI is missing, each built twice from PyPI's sdist and published only when both builds match. Index and details: https://wheelgap.github.io/wheels/"
            # Upload before the index names them, so the index never links a missing file.
            gh release upload gap-wheels release/*.whl --clobber
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gap-wheels.json
          if ! git diff --cached --quiet; then
            git commit -m "Gap wheels $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3 4 5; do
              git push && break
              [ "$attempt" = 5 ] && { echo "couldn't push the index" >&2; exit 1; }
              sleep $((attempt * 10))
              git pull --rebase origin main
            done
          fi
          while IFS= read -r asset; do
            [ -n "$asset" ] && gh release delete-asset gap-wheels "$asset" --yes || true
          done < release/withdraw.txt
          gh workflow run pages.yml --ref main
